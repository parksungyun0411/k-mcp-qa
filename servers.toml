# 시험 대상 서버 목록. 출발점은 darjeeling/awesome-mcp-korea (2026-10-03 확인).
# sha 는 시험한 커밋이다. install 은 작업 디렉터리(cwd = 저장소 루트 또는 subdir)에서 순서대로 실행한다.
# npm 은 항상 --ignore-scripts 로 설치하고(라이프사이클 스크립트 미실행) 빌드는 tsc 를 직접 부른다.
# placeholder_env 의 값은 실제 키가 아니다. 키가 없으면 시작하지 않는 서버를 띄우기 위한 자리 표시자다.

[[server]]
id = "korean-law-mcp"
repo = "chrisryugj/korean-law-mcp"
sha = "ff33a713970d7b504bb08cd1fc3b03944aca5757"
license = "MIT"
runtime = "node"
upstream_api = "국가법령정보센터 Open API (law.go.kr)"
install = [["npm", "ci", "--ignore-scripts", "--no-audit", "--no-fund"], ["npx", "--no-install", "tsc"]]
command = ["node", "build/index.js"]
key_env = ["LAW_OC"]

