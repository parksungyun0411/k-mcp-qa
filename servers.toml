[[server]]
id = "data-go-nts-business-verification"
repo = "Koomook/data-go-mcp-servers"
sha = "dd27f99490400b31fa14f96045a138fa217580a4"
license = "Apache-2.0"
runtime = "python"
upstream_api = "국세청 사업자등록정보 진위확인 및 상태조회 (data.go.kr 15081808)"
subdir = "src/nts-business-verification"
install = [["uv", "venv", "-q", "-p", "3.12", ".venv"], ["uv", "pip", "install", "-q", "-p", ".venv", "-e", "."]]
command = [".venv/bin/python", "-m", "data_go_mcp.nts_business_verification.server"]
key_env = ["API_KEY"]

# 같은 커밋에 의존성 하나만 고정한 변형. 원본(위)은 pyproject 의 "mcp[cli]>=1.13.0" 이 mcp 2.x 로
# 해석되어 기동하지 않는다. 프로토콜 동작을 보려고 mcp<2 를 추가로 고정했다(이 프로젝트의 수정).
[[server]]
id = "data-go-nts-business-verification-mcp1"
repo = "Koomook/data-go-mcp-servers"
sha = "dd27f99490400b31fa14f96045a138fa217580a4"
license = "Apache-2.0"
runtime = "python"
upstream_api = "국세청 사업자등록정보 진위확인 및 상태조회 (data.go.kr 15081808)"
subdir = "src/nts-business-verification"
variant_of = "data-go-nts-business-verification"
modification = "mcp<2 고정"
install = [["uv", "venv", "-q", "-p", "3.12", ".venv"], ["uv", "pip", "install", "-q", "-p", ".venv", "-e", ".", "mcp[cli]<2"]]
command = [".venv/bin/python", "-m", "data_go_mcp.nts_business_verification.server"]
key_env = ["API_KEY"]

[[server.agreement]]
tool = "check_business_status"
args = { business_numbers = "1248100998" }
direct = "nts_status"
direct_args = { b_no = "1248100998" }
fields = ["b_no", "b_stt"]
key_map = { API_KEY = "DATA_GO_KR_SERVICE_KEY" }


