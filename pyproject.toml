[project]
name = "k-mcp-qa"
version = "0.1.0"
description = "한국 공공데이터 MCP 서버 품질 점검"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "jsonschema>=4.23",
    "httpx>=0.28,<1",
    "starlette>=1.0",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=9", "pytest-asyncio>=1.0", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kmcpqa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/kmcpqa/spec"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
